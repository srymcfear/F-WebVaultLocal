<!DOCTYPE html>
<html lang="vi" data-theme="crimson">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob: 'unsafe-inline' 'unsafe-eval' https://fonts.googleapis.com https://fonts.gstatic.com https://cdn.jsdelivr.net https://www.googleapis.com https://api.github.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; connect-src 'self' https://cdn.jsdelivr.net https://www.googleapis.com https://api.github.com;">
<title>FEAR · VAULT</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js" async></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}

:root {
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-display: 'Chakra Petch', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;

  /* CRIMSON BATTLEDECK THEME (DEFAULT) */
  --bg-dark: #05080f;
  --bg-card: #0c0508;
  --bg-card-hover: #17090e;
  --border: rgba(255, 0, 60, 0.35);
  --border-hover: #ff003c;
  --primary: #ff003c;
  --primary-hover: #ff3366;
  --primary-glow: rgba(255, 0, 60, 0.4);
  --accent: #ff003c;
  --accent-hover: #ff3366;
  --accent-glow: rgba(255, 0, 60, 0.4);
  --foreground: #f8fafc;
  --muted: #94a3b8;
  --badge-bg: rgba(255, 0, 60, 0.15);
  --success: #10b981;
  --warning: #f59e0b;
  --error: #ef4444;
}

[data-theme="purple"] {
  /* DEEP NEON PURPLE THEME */
  --bg-dark: #090d16;
  --bg-card: #101426;
  --bg-card-hover: #181d36;
  --border: rgba(139, 92, 246, 0.35);
  --border-hover: #8b5cf6;
  --primary: #8b5cf6;
  --primary-hover: #a78bfa;
  --primary-glow: rgba(139, 92, 246, 0.4);
  --accent: #8b5cf6;
  --accent-hover: #a78bfa;
  --accent-glow: rgba(139, 92, 246, 0.4);
  --foreground: #f8fafc;
  --muted: #94a3b8;
  --badge-bg: rgba(139, 92, 246, 0.15);
}

[data-theme="cyan"] {
  /* CYAN CYBERPUNK THEME */
  --bg-dark: #040812;
  --bg-card: #081020;
  --bg-card-hover: #0e1b34;
  --border: rgba(0, 240, 255, 0.35);
  --border-hover: #00f0ff;
  --primary: #00f0ff;
  --primary-hover: #38bdf8;
  --primary-glow: rgba(0, 240, 255, 0.4);
  --accent: #00f0ff;
  --accent-hover: #38bdf8;
  --accent-glow: rgba(0, 240, 255, 0.4);
  --foreground: #f8fafc;
  --muted: #94a3b8;
  --badge-bg: rgba(0, 240, 255, 0.15);
}

[data-theme="crimson"] {
  --bg-dark: #05080f;
  --bg-card: #0c0508;
  --bg-card-hover: #17090e;
  --border: rgba(255, 0, 60, 0.35);
  --border-hover: #ff003c;
  --primary: #ff003c;
  --primary-hover: #ff3366;
  --primary-glow: rgba(255, 0, 60, 0.4);
  --accent: #ff003c;
  --accent-hover: #ff3366;
  --accent-glow: rgba(255, 0, 60, 0.4);
  --foreground: #f8fafc;
  --muted: #94a3b8;
  --badge-bg: rgba(255, 0, 60, 0.15);
}

html, body{
  background-color:var(--bg-dark) !important;
  width:100%;
  height:100vh;
  margin:0;
  padding:0;
  overflow:hidden;
  display:flex;
  font-family:var(--font-sans);
  color:var(--foreground);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  position:relative;
  user-select:none;
}

/* ─── LEFT VERTICAL NAVIGATION DOCK (IMAGE 2 INSPIRATION) ─── */
.left-dock {
  width: 68px;
  height: 100vh;
  background: rgba(0, 0, 0, 0.65);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px 0;
  gap: 20px;
  z-index: 100;
  flex-shrink: 0;
}
.dock-logo {
  width: 42px;
  height: 42px;
  background: var(--badge-bg);
  border: 1.5px solid var(--border-hover);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--accent);
  font-weight: 900;
  font-family: var(--font-display);
  font-size: 18px;
  box-shadow: 0 0 14px var(--accent-glow);
}
.dock-menu {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  align-items: center;
  margin-top: 10px;
}
.dock-btn {
  width: 46px;
  height: 46px;
  border-radius: 12px;
  background: transparent;
  border: 1px solid transparent;
  color: var(--muted);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s ease;
  position: relative;
}
.dock-btn:hover, .dock-btn.active {
  background: var(--badge-bg);
  border-color: var(--border-hover);
  color: var(--accent);
  box-shadow: 0 0 12px var(--accent-glow);
}
.dock-btn.active::before {
  content: '';
  position: absolute;
  left: -11px;
  width: 4px;
  height: 24px;
  background: var(--accent);
  border-radius: 0 4px 4px 0;
  box-shadow: 0 0 10px var(--accent);
}

/* Background Canvas */
#cosmic-canvas{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  pointer-events:none;
  z-index:0;
}

.container{
  flex:1;
  height:100vh;
  position:relative;
  z-index:1;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* Main App Shell & Top Telemetry Header */
.terminal-section{
  width:100%;
  height:100vh;
  display:flex;
  flex-direction:column;
  background:transparent;
  overflow:hidden;
}
.terminal-section .title-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 24px;
  height:52px;
  border-bottom:1px solid var(--border);
  background:rgba(0, 0, 0, 0.75);
  flex-shrink:0;
  font-family:var(--font-mono);
  font-size:12px;
}
.terminal-section .title-bar .dot{width:12px;height:12px;border-radius:50%;}
.terminal-section .title-bar .dot.r{background:var(--error)}
.terminal-section .title-bar .dot.y{background:var(--warning)}
.terminal-section .title-bar .dot.g{background:var(--success)}
.terminal-section .title-bar .lbl{
  margin-left:12px;
  font-size:14px;
  color:var(--muted);
  font-family:var(--font-mono);
  display:flex;
  align-items:center;
  gap:14px;
  flex:1;
}
.terminal-section .title-bar .lbl b{
  color:#00f0ff;
  font-weight:900;
  font-family:var(--font-display);
  letter-spacing:1.5px;
  font-size:16px;
}
.terminal-section .body{padding:20px 24px;font-size:15px;flex:1;overflow:hidden;display:flex;flex-direction:column;}

/* Forms & Chamfered Cut Inputs (Image 1 Style) */
.terminal-input{
  width:100%;
  height:48px;
  padding:0 20px;
  font-family:var(--font-sans);
  font-size:14.5px;
  background:var(--bg-card);
  border:1px solid var(--border);
  color:var(--foreground);
  outline:none;
  clip-path:polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
  transition:border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
}
.terminal-input:focus{
  border-color:var(--accent);
  box-shadow:0 0 14px var(--accent-glow);
  background:var(--bg-card-hover);
}
.terminal-input::placeholder{color:#64748b}
/* Capsule / Pill Input for Master Password */
.input-pill{
  border-radius:9999px !important;
  height:52px !important;
  padding:0 26px !important;
  font-size:15px !important;
  background:rgba(4,7,14,0.94) !important;
  border:1.5px solid var(--border) !important;
  color:#ffffff !important;
  outline:none !important;
  clip-path:none !important;
}
.input-pill:focus{
  border-color:var(--accent) !important;
  box-shadow:0 0 16px var(--accent-glow) !important;
}

/* 6 OTP Squircle Dark Cyber Boxes for 2FA */
.otp-group{
  display:flex;
  gap:10px;
  justify-content:center;
  margin:16px 0 12px 0;
}
.otp-box, .setup-otp-box{
  width:48px;
  height:54px;
  border-radius:14px;
  text-align:center;
  font-family:var(--font-mono);
  font-size:22px;
  font-weight:900;
  color:#ffffff;
  background:rgba(4,7,14,0.95);
  border:1.5px solid var(--border);
  outline:none;
  clip-path:none !important;
  transition:all 0.15s ease;
  box-shadow:inset 0 2px 6px rgba(0,0,0,0.8);
}
.otp-box:focus, .setup-otp-box:focus{
  border-color:var(--accent);
  box-shadow:0 0 16px var(--accent-glow);
  transform:scale(1.06) translateY(-2px);
  background:rgba(8,14,26,0.98);
}
.otp-footer{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 6px;
  font-size:13px;
  color:var(--muted);
}

/* Theme Picker Component */
.theme-picker {
  display: flex;
  gap: 6px;
  background: rgba(0,0,0,0.6);
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: 8px;
  align-items: center;
}
.theme-dot {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  cursor: pointer;
  border: 2px solid transparent;
  transition: transform 0.2s, border-color 0.2s;
}
.theme-dot:hover { transform: scale(1.25); }
.theme-dot.crimson { background: #ff003c; }
.theme-dot.purple { background: #8b5cf6; }
.theme-dot.cyan { background: #00f0ff; }

/* Buttons with Tactical Chamfered Geometry */
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  height:44px;
  padding:0 20px;
  font-family:var(--font-display);
  font-size:13px;
  font-weight:800;
  letter-spacing:0.8px;
  cursor:pointer;
  transition:all 0.2s ease;
  text-decoration:none;
  white-space:nowrap;
  border:none;
  clip-path:polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
}
.btn-terminal{
  background:var(--bg-card);
  color:var(--foreground);
  border:1px solid var(--border);
}
.btn-terminal:hover{
  color:#ffffff;
  border-color:var(--border-hover);
  background:var(--bg-card-hover);
  transform:translateY(-2px);
  box-shadow:0 4px 16px var(--accent-glow);
}
.btn-terminal-primary{
  background:var(--accent);
  color:#000000;
  font-weight:900;
  border:1px solid var(--accent);
  box-shadow:0 4px 16px var(--accent-glow);
}
.btn-terminal-primary:hover{
  background:var(--primary-hover);
  box-shadow:0 0 20px var(--accent-glow);
  transform:translateY(-2px);
  color:#000000;
}
.btn-danger{
  background:rgba(239,68,68,0.14);
  color:var(--error);
  border:1px solid rgba(239,68,68,0.35);
}
.btn-danger:hover{
  background:rgba(239,68,68,0.3);
  border-color:var(--error);
  color:#ffffff;
  transform:translateY(-2px);
}
.btn-sm{height:36px;padding:0 14px;font-size:12px;}

/* Toolbar & Layout */
.prompt-line{display:flex;align-items:center;gap:10px}

/* Filter Pills */
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.pill{
  padding:7px 16px;
  border-radius:24px;
  font-size:12px;
  font-weight:600;
  cursor:pointer;
  border:1px solid var(--border);
  color:var(--muted);
  background:rgba(4,7,14,0.75);
  transition:all 0.2s ease;
}
.pill.active{
  border-color:var(--accent);
  color:#000000;
  font-weight:800;
  background:linear-gradient(135deg, #00f0ff, #38bdf8);
  box-shadow:0 0 16px var(--accent-glow);
}
.pill:hover:not(.active){border-color:var(--border-hover);color:var(--foreground);transform:translateY(-1px)}

/* 3D Cyber HUD Lock Screen Card */
.lock-screen{
  position:relative;
  overflow:hidden;
  width:100%;
  max-width:480px;
  margin:20px auto;
  padding:42px 36px;
  text-align:center;
  border:1.5px solid rgba(0,240,255,0.4);
  border-radius:28px;
  background:rgba(6,11,22,0.85);
  backdrop-filter:blur(24px);
  box-shadow:0 24px 72px rgba(0,0,0,0.95), inset 0 0 40px rgba(0,240,255,0.08);
  transform-style:preserve-3d;
  transition:transform 0.15s ease-out;
}
#recover-btn:hover, #cloud-pull-lock-btn:hover{
  color:#ffffff !important;
  text-shadow:0 0 14px #00f0ff !important;
  transform:translateY(-1px);
}
.lock-screen .glow{
  position:absolute;
  top:25%;
  left:50%;
  width:240px;
  height:240px;
  background:radial-gradient(circle, rgba(0,240,255,0.1), rgba(56,189,248,0.05), transparent 70%);
  transform:translate(-50%,-50%);
  pointer-events:none;
}

/* Cyber HUD Telemetry Header */
.hud-telemetry{
  display:flex;
  flex-direction:column;
  align-items:center;
  margin-bottom:14px;
  font-family:var(--font-mono);
  position:relative;
  z-index:2;
}
.hud-tag{
  font-size:10px;
  font-weight:700;
  color:#00f0ff;
  letter-spacing:3px;
  opacity:0.9;
}
.hud-num{
  font-family:var(--font-display);
  font-size:22px;
  font-weight:800;
  color:#ffffff;
  letter-spacing:3px;
  margin-top:2px;
}
.hud-num span{color:#00f0ff}

/* Cyber HUD Progress Bar */
.hud-progress{
  display:flex;
  align-items:center;
  gap:10px;
  width:100%;
  margin-bottom:18px;
  position:relative;
  z-index:2;
}
.hud-progress-bar{
  flex:1;
  height:4px;
  background:rgba(0,240,255,0.15);
  border-radius:2px;
  overflow:hidden;
  position:relative;
}
.hud-progress-bar::after{
  content:'';
  position:absolute;
  left:0;
  top:0;
  height:100%;
  width:85%;
  background:linear-gradient(90deg, #00f0ff, #38bdf8);
  box-shadow:0 0 10px #00f0ff;
}
.hud-progress-txt{
  font-family:var(--font-mono);
  font-size:10px;
  font-weight:700;
  color:#00f0ff;
  letter-spacing:1px;
}

/* Cyber HUD Corner Brackets */
.hud-corner{
  position:absolute;
  width:16px;
  height:16px;
  border:2px solid #00f0ff;
  pointer-events:none;
  opacity:0.85;
}
.hud-corner.top-left{top:12px;left:12px;border-right:none;border-bottom:none}
.hud-corner.top-right{top:12px;right:12px;border-left:none;border-bottom:none}
.hud-corner.bottom-left{bottom:12px;left:12px;border-right:none;border-top:none}
.hud-corner.bottom-right{bottom:12px;right:12px;border-left:none;border-top:none}

/* Spinning Circular Stamp Badge */
.spinning-stamp-container{
  position:absolute;
  right:-15px;
  bottom:-15px;
  width:130px;
  height:130px;
  pointer-events:none;
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0.85;
}
.spinning-stamp{
  width:100%;
  height:100%;
  animation:spinStamp 18s linear infinite;
}
@keyframes spinStamp{
  0%{transform:rotate(0deg)}
  100%{transform:rotate(360deg)}
}
.stamp-center-icon{
  position:absolute;
  width:36px;
  height:36px;
  border-radius:50%;
  background:rgba(0,240,255,0.15);
  border:1px solid rgba(0,240,255,0.4);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#00f0ff;
}

/* Ghost Background Typography */
.ghost-typography{
  position:absolute;
  left:-10px;
  bottom:35px;
  z-index:0;
  pointer-events:none;
  user-select:none;
  display:flex;
  flex-direction:column;
  line-height:0.85;
  text-align:left;
  opacity:0.35;
}
.ghost-text-primary{
  font-family:var(--font-display);
  font-size:44px;
  font-weight:900;
  color:rgba(255,255,255,0.03);
  letter-spacing:3px;
}
.ghost-text-outline{
  font-family:var(--font-display);
  font-size:44px;
  font-weight:900;
  -webkit-text-stroke:1px rgba(0,240,255,0.2);
  color:transparent;
  letter-spacing:3px;
}

.lock-screen .icon-wrapper{
  width:68px;
  height:68px;
  margin:0 auto 16px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:20px;
  background:linear-gradient(135deg, rgba(0,240,255,0.25), rgba(56,189,248,0.25));
  border:1px solid rgba(0,240,255,0.4);
  color:#00f0ff;
  box-shadow:0 6px 20px rgba(0,240,255,0.25);
  position:relative;
  z-index:1;
}
.lock-screen h2{
  font-family:var(--font-display);
  font-size:26px;
  font-weight:900;
  letter-spacing:2px;
  color:#ffffff;
  margin-bottom:6px;
  background:linear-gradient(135deg, #ffffff, #00f0ff, #38bdf8);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  position:relative;
  z-index:1;
}
.lock-screen .hint{font-size:13px;color:var(--muted);margin-bottom:20px;position:relative;z-index:1}

/* Vault Entries - Zero-Lag Solid Dark Card Tiles */
.vault-entry{
  display:flex;
  align-items:center;
  gap:20px;
  padding:18px 24px;
  border-radius:16px;
  border:1px solid rgba(0,240,255,0.25);
  background:#091222;
  font-size:15px;
  transition:border-color 0.15s ease, background 0.15s ease;
  margin-bottom:12px;
}
.vault-entry:hover{
  border-color:rgba(0,240,255,0.65);
  background:#0e1b32;
}
.icon-letter{
  width:48px;
  height:48px;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  font-family:var(--font-display);
  font-size:20px;
  flex-shrink:0;
  box-shadow:0 6px 18px rgba(0,240,255,0.25);
}
.vault-entry .service{font-weight:800;color:#ffffff;min-width:140px;font-size:16px;letter-spacing:0.3px;}
.vault-entry .username{color:#94a3b8;min-width:180px;font-family:var(--font-mono);font-size:14px;}
.vault-entry .pass{font-family:var(--font-mono);color:#00f0ff;min-width:140px;letter-spacing:2px;font-size:14.5px;font-weight:700;}
.vault-entry .cat{font-size:11.5px;font-weight:800;color:var(--primary);text-transform:uppercase;letter-spacing:1px;padding:5px 14px;border-radius:9999px;background:rgba(0,240,255,0.08);border:1px solid rgba(0,240,255,0.25)}
.vault-entry .actions{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap;}
.btn-sm{height:38px;padding:0 16px;font-size:12.5px;border-radius:10px;font-weight:700;}

/* Password Strength Meter Bar */
.pw-meter{
  width:100%;
  height:5px;
  background:rgba(255,255,255,0.1);
  border-radius:3px;
  overflow:hidden;
  margin-top:6px;
  position:relative;
}
.pw-meter-bar{
  height:100%;
  width:0%;
  transition:width 0.3s ease, background-color 0.3s ease;
  border-radius:3px;
}
.pw-strength-lbl{
  font-family:var(--font-mono);
  font-size:11px;
  font-weight:700;
  margin-top:4px;
  display:flex;
  justify-content:space-between;
}

/* Modals */
.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.85);
  backdrop-filter:blur(10px);
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.modal{
  width:100%;
  max-width:560px;
  background:rgba(6,12,24,0.96);
  border:1.5px solid rgba(0,240,255,0.4);
  border-radius:24px;
  padding:32px;
  box-shadow:0 24px 72px rgba(0,0,0,0.95), 0 0 40px rgba(0,240,255,0.18);
  max-height:92vh;
  overflow-y:auto;
}
.modal h3{
  font-family:var(--font-display);
  font-size:20px;
  font-weight:800;
  color:#ffffff;
  margin-bottom:14px;
  display:flex;

/* Toast */
.toast{
  position:fixed;
  bottom:24px;
  right:24px;
  z-index:999;
  padding:12px 20px;
  border-radius:12px;
  font-size:13px;
  font-weight:700;
  font-family:var(--font-mono);
  box-shadow:0 10px 30px rgba(0,0,0,0.8);
  animation:slideUp 0.3s ease;
}
.toast.success{background:rgba(16,185,129,0.9);color:#000000;border:1px solid #10b981}
.toast.error{background:rgba(239,68,68,0.9);color:#ffffff;border:1px solid #ef4444}
@keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.w-full{width:100%}
.mb-4{margin-bottom:16px}
.mb-12{margin-bottom:12px}
.mb-16{margin-bottom:16px}

/* ─── 2-COLUMN DASHBOARD GRID & FIXED INDEPENDENT SIDEBAR ─── */
.dashboard-grid{
  display:grid;
  grid-template-columns:1fr 320px;
  gap:24px;
  width:100%;
  height:100%;
  overflow:hidden;
}
@media (max-width: 1080px){
  .dashboard-grid{
    grid-template-columns:1fr;
    overflow-y:auto;
  }
}

.main-column{
  display:flex;
  flex-direction:column;
  width:100%;
  height:100%;
  overflow:hidden;
}

.main-column-header{
  flex-shrink:0;
  display:flex;
  flex-direction:column;
  gap:14px;
  padding-bottom:14px;
  border-bottom:1px solid rgba(0,240,255,0.15);
  margin-bottom:14px;
}

.main-column-feed{
  flex:1;
  overflow-y:auto;
  padding-right:6px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.sidebar-panel{
  display:flex;
  flex-direction:column;
  gap:16px;
  height:100%;
  overflow-y:auto;
  padding-right:4px;
}

.sidebar-card{
  background:#0a1122;
  border:1px solid rgba(0,240,255,0.25);
  border-radius:16px;
  padding:18px;
  transition:border-color 0.15s ease;
}
.sidebar-card:hover{
  border-color:rgba(0,240,255,0.6);
}
.sidebar-card .card-header{
  font-family:var(--font-display);
  font-size:13px;
  font-weight:800;
  color:#00f0ff;
  letter-spacing:1.5px;
  margin-bottom:14px;
  padding-bottom:10px;
  border-bottom:1px solid rgba(0,240,255,0.18);
  display:flex;
  align-items:center;
  gap:8px;
}
.stat-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:13px;
  color:#94a3b8;
  margin-bottom:8px;
}
/* ─── SLEEK CUSTOM CYBER SCROLLBARS ─── */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {
  background: rgba(4, 7, 14, 0.4);
  border-radius: 4px;
}
::-webkit-scrollbar-thumb {
  background: rgba(0, 240, 255, 0.3);
  border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover {
  background: rgba(0, 240, 255, 0.75);
}
::-webkit-scrollbar-corner {
  background: transparent;
}
* {
  scrollbar-width: thin;
  scrollbar-color: rgba(0, 240, 255, 0.3) rgba(4, 7, 14, 0.4);
}

.sidebar-cat-list{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  width:100%;
}
.sidebar-cat-item{
  display:flex;
  align-items:center;
  gap:10px;
  background:#091222;
  border:1.5px solid rgba(0, 240, 255, 0.25);
  border-radius:14px;
  padding:6px;
  cursor:pointer;
  user-select:none;
  transition:border-color 0.15s ease, background 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
}
.sidebar-cat-item:hover{
  border-color:#00f0ff;
  background:#0e1d38;
  transform:translateY(-2px);
  box-shadow:0 4px 16px rgba(0,240,255,0.2);
}
.sidebar-cat-item:hover .cat-title-text{
  color:#ffffff;
}
.sidebar-cat-item.full-width{
  grid-column:span 2;
}

/* Left Stacked Badge inside Card */
.cat-left-block{
  width:42px;
  height:44px;
  border-radius:10px;
  background:rgba(0, 240, 255, 0.1);
  border:1px solid rgba(0, 240, 255, 0.25);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  overflow:hidden;
  transition:border-color 0.15s ease, background 0.15s ease;
}
.cat-count-num{
  font-family:var(--font-mono);
  font-size:13px;
  font-weight:900;
  color:#00f0ff;
  line-height:1;
  padding-top:2px;
}
.cat-icon-box{
  font-size:14px;
  padding-bottom:1px;
}

/* Right Name Area inside Card */
.cat-right-block{
  flex:1;
  height:44px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 4px;
  text-align:center;
  overflow:hidden;
  container-type:inline-size;
}
.cat-title-text{
  font-size:clamp(9px, 12cqw, 12.5px);
  font-weight:800;
  color:#e2e8f0;
  letter-spacing:0.3px;
  line-height:1.15;
  word-break:break-word;
  max-height:36px;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  text-align:center;
}
  text-overflow:ellipsis;
  overflow:hidden;
}

/* Active State for Unified Card */
.sidebar-cat-item.active{
  border-color:#00f0ff;
  background:linear-gradient(135deg, rgba(0,240,255,0.25), rgba(56,189,248,0.15));
  box-shadow:0 0 16px rgba(0,240,255,0.3);
}
.sidebar-cat-item.active .cat-left-block{
  background:rgba(0, 240, 255, 0.25);
  border-color:#00f0ff;
}
.sidebar-cat-item.active .cat-title-text{
  color:#00f0ff;
  font-weight:900;
}

/* Hardware Accelerated Smooth Animations */
.vault-entry, .btn, .terminal-input, .pill, .sidebar-card, .sidebar-cat-item{
  will-change:transform, box-shadow;
  transition:transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.25s ease, border-color 0.25s ease;
}

.items-center{align-items:center}
.justify-between{justify-content:space-between}

/* Custom Checkbox Pill */
.toggle-opt{

}

  }

const PBKDF2_ITERATIONS = 100000
const KEY_LENGTH = 256
const SALT_LENGTH = 16
const IV_LENGTH = 12
const AUTO_LOCK_MS = 5 * 60 * 1000
const CLIPBOARD_CLEAR_MS = 30 * 1000

// ─── INDEXEDDB PERSISTENT STORAGE ENGINE ─────────────
const DB_NAME = 'FearVaultDB', DB_STORE = 'vault_store', DB_VERSION = 1

function openDB(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION)
    req.onupgradeneeded = (e) => {
      const db = e.target.result
      if(!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE)
    }
    req.onsuccess = () => resolve(req.result)
    req.onerror = () => reject(req.error)
  })
}

async function setDBItem(key, val){
  try{
    const db = await openDB()
    return new Promise((resolve)=>{
      const tx = db.transaction(DB_STORE, 'readwrite')
      tx.objectStore(DB_STORE).put(val, key)
      tx.oncomplete = () => resolve(true)
      tx.onerror = () => resolve(false)
    })
  }catch{ return false }
}

async function getDBItem(key){
  try{
    const db = await openDB()
    return new Promise((resolve)=>{
      const tx = db.transaction(DB_STORE, 'readonly')
      const req = tx.objectStore(DB_STORE).get(key)
      req.onsuccess = () => resolve(req.result)
      req.onerror = () => resolve(null)
    })
  }catch{ return null }
}

async function requestPersistentStorage(){
  if(navigator.storage && navigator.storage.persist){
    try{
      const isPersisted = await navigator.storage.persisted()
      if(!isPersisted) await navigator.storage.persist()
    }catch{}
  }
}

async function initIndexedDBAutoRestore(){
  await requestPersistentStorage()
  const localData = localStorage.getItem(STORAGE_KEY)
  if(!localData || localData === '{}'){
    const dbData = await getDBItem(STORAGE_KEY)
    if(dbData){
      localStorage.setItem(STORAGE_KEY, JSON.stringify(dbData))
      if(state.page === 'locked') render()
    }
  }
}

// ─── CRYPTO UTILITIES ────────────────────────────────
function b64ToBuf(b64){const b=atob(b64);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u.buffer}
function bufToB64(buf){const u=new Uint8Array(buf);let b='';for(let i=0;i<u.byteLength;i++)b+=String.fromCharCode(u[i]);return btoa(b)}
function randBytes(n){return crypto.getRandomValues(new Uint8Array(n))}

function getSecureRandomInt(max){
  if(!max || max <= 0) return 0
  const limit = 256 - (256 % max)
  let val
  do {
    val = randBytes(1)[0]
  } while (val >= limit)
  return val % max
}

async function deriveKey(pw,salt){
  const enc=new TextEncoder()
  const km=await crypto.subtle.importKey('raw',enc.encode(pw),{name:'PBKDF2'},false,['deriveKey'])
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:PBKDF2_ITERATIONS,hash:'SHA-256'},km,{name:'AES-GCM',length:KEY_LENGTH},false,['encrypt','decrypt'])
}

async function pbkdf2Hash(pw,salt){
  const enc=new TextEncoder()
  const km=await crypto.subtle.importKey('raw',enc.encode(pw),{name:'PBKDF2'},false,['deriveBits'])
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:PBKDF2_ITERATIONS,hash:'SHA-256'},km,256)
  return bufToB64(bits)
}

async function hashPassword(pw){
  const salt=randBytes(SALT_LENGTH)
  const hash=await pbkdf2Hash(pw,salt)
  return bufToB64(salt.buffer)+':'+hash
}

async function verifyPassword(pw,stored){
  const ci=stored.indexOf(':')
  const salt=new Uint8Array(b64ToBuf(stored.slice(0,ci)))
  const sh=stored.slice(ci+1)
  const c=await pbkdf2Hash(pw,salt)
  return c===sh
}

function generateVaultKey(){return bufToB64(randBytes(32).buffer)}
function generateRecoveryKey(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let k='FEAR-';const r=randBytes(8);for(let i=0;i<8;i++){if(i===4)k+='-';k+=c[r[i]%c.length]}return k}

async function aesEncrypt(pt,pw){
  const salt=randBytes(SALT_LENGTH);const iv=randBytes(IV_LENGTH)
  const key=await deriveKey(pw,salt)
  const enc=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(pt))
  const c=new Uint8Array(salt.length+iv.length+enc.byteLength)
  c.set(salt,0);c.set(iv,salt.length);c.set(new Uint8Array(enc),salt.length+iv.length)
  return bufToB64(c.buffer)
}

async function aesDecrypt(ct,pw){
  const c=new Uint8Array(b64ToBuf(ct))
  const salt=c.slice(0,SALT_LENGTH);const iv=c.slice(SALT_LENGTH,SALT_LENGTH+IV_LENGTH);const d=c.slice(SALT_LENGTH+IV_LENGTH)
  const key=await deriveKey(pw,salt)
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv},key,d))
}

async function directEncrypt(plaintext, rawKeyB64){
  const keyBytes=new Uint8Array(b64ToBuf(rawKeyB64))
  const iv=randBytes(IV_LENGTH)
  const key=await crypto.subtle.importKey('raw',keyBytes,{name:'AES-GCM'},false,['encrypt'])
  const enc=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(plaintext))
  const out=new Uint8Array(iv.length+enc.byteLength)
  out.set(iv,0);out.set(new Uint8Array(enc),iv.length)
  return bufToB64(out.buffer)
}

async function directDecrypt(ciphertext, rawKeyB64){
  const keyBytes=new Uint8Array(b64ToBuf(rawKeyB64))
  const c=new Uint8Array(b64ToBuf(ciphertext))
  const iv=c.slice(0,IV_LENGTH);const d=c.slice(IV_LENGTH)
  const key=await crypto.subtle.importKey('raw',keyBytes,{name:'AES-GCM'},false,['decrypt'])
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv},key,d))
}

// ─── BASE32 ──────────────────────────────────────────
function base32Encode(buf){
  const a='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567'
  const u=new Uint8Array(buf);let bits='',r=''
  for(const b of u)bits+=b.toString(2).padStart(8,'0')
  for(let i=0;i<bits.length;i+=5)r+=a[parseInt(bits.substring(i,i+5).padEnd(5,'0'),2)]
  return r
}

function base32Decode(s){
  const a='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';let bits=''
  for(const c of s.toUpperCase().replace(/[^A-Z2-7]/g,'')){ const v=a.indexOf(c);if(v>=0)bits+=v.toString(2).padStart(5,'0') }
  const bytes=new Uint8Array(Math.floor(bits.length/8))
  for(let i=0;i<bytes.length;i++)bytes[i]=parseInt(bits.substring(i*8,i*8+8),2)
  return bytes.buffer
}

// ─── TOTP (RFC 6238) ─────────────────────────────────
async function generateTOTPCode(secretB32, counter){
  const secret=base32Decode(secretB32)
  const cBuf=new ArrayBuffer(8);const v=new DataView(cBuf)
  v.setUint32(0,Math.floor(counter/0x100000000));v.setUint32(4,counter&0xffffffff)
  const key=await crypto.subtle.importKey('raw',secret,{name:'HMAC',hash:'SHA-1'},false,['sign'])
  const hmac=new Uint8Array(await crypto.subtle.sign('HMAC',key,cBuf))
  const o=hmac[19]&0x0f
  const code=(((hmac[o]&0x7f)<<24)|((hmac[o+1]&0xff)<<16)|((hmac[o+2]&0xff)<<8)|(hmac[o+3]&0xff))%1000000
  return code.toString().padStart(6,'0')
}

async function verifyTOTP(secretB32, inputCode){
  const now=Math.floor(Date.now()/1000/TOTP_PERIOD)
  for(let i=-1;i<=1;i++){
    const code=await generateTOTPCode(secretB32,now+i)
    if(code===inputCode)return true
  }
  return false
}

// ─── QR CODE RENDERER ────────────────────────────────
function renderQR(text, containerId){
  const el=document.getElementById(containerId)
  if(!el)return
  if(typeof qrcode==='undefined'){
    el.innerHTML='<p style="font-size:13px;color:var(--warning);padding:16px;">⚠ QR không khả dụng (offline). Nhập thủ công Secret Key bên dưới.</p>'
    return
  }
  try{
    const qr=qrcode(0,'M');qr.addData(text);qr.make()
    const cnt=qr.getModuleCount(),cell=5,mg=10,sz=cnt*cell+mg*2
    let svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}" style="border-radius:8px;">`
    svg+=`<rect width="${sz}" height="${sz}" fill="#0f0c1b"/>`
    for(let r=0;r<cnt;r++)for(let c=0;c<cnt;c++)if(qr.isDark(r,c))svg+=`<rect x="${c*cell+mg}" y="${r*cell+mg}" width="${cell}" height="${cell}" fill="#00f0ff"/>`
    svg+='</svg>'
    el.innerHTML=svg
  }catch(e){el.innerHTML='<p style="font-size:13px;color:var(--error);">Lỗi tạo QR: '+e.message+'</p>'}
}

// ─── EXPORT/IMPORT ENVELOPE (v2) ────────────────────
async function deriveExportKeys(pw,salt){
  const enc=new TextEncoder()
  const km=await crypto.subtle.importKey('raw',enc.encode(pw),{name:'PBKDF2'},false,['deriveBits'])
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:PBKDF2_ITERATIONS,hash:'SHA-256'},km,512)
  const eb=new Uint8Array(bits.slice(0,32));const hb=new Uint8Array(bits.slice(32))
  const ek=await crypto.subtle.importKey('raw',eb,{name:'AES-GCM'},false,['encrypt','decrypt'])
  const hk=await crypto.subtle.importKey('raw',hb,{name:'HMAC',hash:'SHA-256'},false,['sign','verify'])
  return{encKey:ek,hmacKey:hk}
}

async function exportVault(data,pw){
  const salt=randBytes(SALT_LENGTH);const iv=randBytes(IV_LENGTH)
  const{encKey,hmacKey}=await deriveExportKeys(pw,salt)
  const enc=await crypto.subtle.encrypt({name:'AES-GCM',iv},encKey,new TextEncoder().encode(data))
  const sb=bufToB64(salt.buffer);const ib=bufToB64(iv.buffer);const cb=bufToB64(enc)
  const sig=await crypto.subtle.sign('HMAC',hmacKey,new TextEncoder().encode(sb+ib+cb))
  return{version:2,created_at:new Date().toISOString(),algorithm:'AES-256-GCM',kdf:{name:'PBKDF2',iterations:PBKDF2_ITERATIONS,hash:'SHA-256'},salt:sb,iv:ib,ciphertext:cb,hmac:bufToB64(sig)}
}

async function importVault(env,pw){
  if(env.version!==2)return null
  const salt=new Uint8Array(b64ToBuf(env.salt));const{encKey,hmacKey}=await deriveExportKeys(pw,salt)
  const sig=b64ToBuf(env.hmac);const valid=await crypto.subtle.verify('HMAC',hmacKey,sig,new TextEncoder().encode(env.salt+env.iv+env.ciphertext))
  if(!valid)return null
  const iv=new Uint8Array(b64ToBuf(env.iv));const ct=b64ToBuf(env.ciphertext)
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv},encKey,ct))
}

// ─── PASSWORD GENERATOR (CSPRNG Rejection Sampling) ─
function genPassword(opts){
  const options = opts || state.genOpts || {len:20, upper:true, lower:true, digits:true, symbols:true}
  const u='ABCDEFGHIJKLMNOPQRSTUVWXYZ',l='abcdefghijklmnopqrstuvwxyz',d='0123456789',s='!@#$%^&*()_-+=<>?'
  let charset=''
  const arr=[]
  if(options.upper) { charset += u; arr.push(u[getSecureRandomInt(u.length)]); }
  if(options.lower) { charset += l; arr.push(l[getSecureRandomInt(l.length)]); }
  if(options.digits) { charset += d; arr.push(d[getSecureRandomInt(d.length)]); }
  if(options.symbols) { charset += s; arr.push(s[getSecureRandomInt(s.length)]); }
  if(!charset) { charset = u+l+d+s; arr.push(u[getSecureRandomInt(u.length)]); }
  
  const targetLen = Math.max(8, options.len || 20)
  while(arr.length < targetLen){
    arr.push(charset[getSecureRandomInt(charset.length)])
  }
  for(let i=arr.length-1;i>0;i--){
    const j=getSecureRandomInt(i+1);
    [arr[i],arr[j]]=[arr[j],arr[i]]
  }
  return arr.join('')
}

// ─── PASSWORD STRENGTH METER ────────────────────────
function calcPasswordStrength(pw){
  if(!pw) return {score:0, text:'RẤT YẾU', color:'#ef4444', percent:0}
  let score = 0
  if(pw.length >= 8) score += 20
  if(pw.length >= 12) score += 15
  if(pw.length >= 16) score += 15
  if(/[a-z]/.test(pw)) score += 12
  if(/[A-Z]/.test(pw)) score += 13
  if(/[0-9]/.test(pw)) score += 12
  if(/[^a-zA-Z0-9]/.test(pw)) score += 13
  
  score = Math.min(100, score)
  if(score < 40) return {score, text:'YẾU', color:'#ef4444', percent:score}
  if(score < 70) return {score, text:'TRUNG BÌNH', color:'#f59e0b', percent:score}
  if(score < 90) return {score, text:'MẠNH', color:'#10b981', percent:score}
  return {score, text:'CYBER-TIER 🩵', color:'#00f0ff', percent:score}
}

function getAllCategories(){
  const defaults=['email','social','dev','finance','shopping','work','other']
  const itemCats=(state.items || []).map(i => (i.category || 'other').trim().toLowerCase()).filter(Boolean)
  return Array.from(new Set([...defaults, ...(state.categories||[]), ...itemCats]))
}

function loadData(){
  try{
    const d=JSON.parse(localStorage.getItem(STORAGE_KEY))||{}
    if(d.custom_categories && Array.isArray(d.custom_categories)){
      const defaults=['email','social','dev','finance','shopping','work','other']
      state.categories=Array.from(new Set([...defaults, ...d.custom_categories]))
    }
    return d
  }catch{return{}}
}
function saveData(d){
  const defaults=['email','social','dev','finance','shopping','work','other']
  state.categories=getAllCategories()
  d.custom_categories=state.categories.filter(c=>!defaults.includes(c))
  localStorage.setItem(STORAGE_KEY,JSON.stringify(d))
  setDBItem(STORAGE_KEY, d)
}

function addCustomCategory(rawName){
  if(!rawName)return null
  const clean=rawName.trim().toLowerCase()
  if(!clean)return null
  if(!state.categories.includes(clean)){
    state.categories.push(clean)
    const data=loadData()
    saveData(data)
  }
  return clean
}

async function renameCategory(oldCat, newCatRaw){
  const clean = (newCatRaw || '').trim().toLowerCase()
  if(!clean || clean === oldCat) return
  if(state.categories.includes(clean)){
    toast('error', 'Danh mục "' + clean.toUpperCase() + '" đã tồn tại!')
    return
  }
  const idx = state.categories.indexOf(oldCat)
  if(idx >= 0) state.categories[idx] = clean
  else state.categories.push(clean)

  const ek = state.vaultKey || state.masterPassword
  const data = loadData()
  for(const i of state.items){
    if((i.category || 'other') === oldCat){
      i.category = clean
      if(ek && data.entries){
        const match = data.entries.find(e => e.id === i.id)
        if(match) match.encrypted = await encryptEntry(i, ek)
      }
    }
  }
  if(state.activeCategory === oldCat) state.activeCategory = clean
  saveData(data)
  toast('success', `Đã đổi tên danh mục thành "${clean.toUpperCase()}"`)
  render()
}

async function deleteCategory(cat){
  const defaults = ['email','social','dev','finance','shopping','work','other']
  if(defaults.includes(cat)){
    toast('error', 'Không thể xóa danh mục mặc định của hệ thống!')
    return
  }
  if(!confirm(`Bạn có chắc muốn xóa danh mục "${cat.toUpperCase()}"? Các tài khoản thuộc danh mục này sẽ chuyển về "OTHER".`)) return

  state.categories = state.categories.filter(c => c !== cat)
  const ek = state.vaultKey || state.masterPassword
  const data = loadData()
  for(const i of state.items){
    if(i.category === cat){
      i.category = 'other'
      if(ek && data.entries){
        const match = data.entries.find(e => e.id === i.id)
        if(match) match.encrypted = await encryptEntry(i, ek)
      }
    }
  }
  if(state.activeCategory === cat) state.activeCategory = ''
  saveData(data)
  toast('success', `Đã xóa danh mục "${cat.toUpperCase()}"`)
  render()
}

// ─── ENTRY HELPERS ───────────────────────────────────
async function decryptEntries(entries,effectiveKey){
  const results=await Promise.all((entries||[]).map(async(e)=>{
    try{
      if(e.encrypted){
        const json=await directDecrypt(e.encrypted,effectiveKey)
        const p=JSON.parse(json)
        return{
          item:{
            id:e.id,
            service:p.service||'',
            username:p.username||'',
            password:p.password||'',
            category:p.category||'',
            notes:p.notes||'',
            url:p.url||'',
            createdAt:p.createdAt||Date.now(),
            updatedAt:p.updatedAt||Date.now()
          },
          legacy:false
        }
      }
      else{
        const pt=await aesDecrypt(e.password,effectiveKey)
        return{
          item:{
            id:e.id,
            service:e.service,
            username:e.username,
            password:pt,
            category:e.category||'',
            notes:'',
            url:'',
            createdAt:Date.now(),
            updatedAt:Date.now()
          },
          legacy:true
        }
      }
    }catch{
      return{
        item:{
          id:e.id,
          service:e.service||'???',
          username:e.username||'',
          password:'[decrypt error]',
          category:e.category||'',
          notes:'',
          url:'',
          createdAt:Date.now(),
          updatedAt:Date.now()
        },
        legacy:false,
        error:true
      }
    }
  }))
  return{items:results.map(r=>r.item),needsMigration:results.some(r=>r.legacy)}
}

async function migrateEntries(items,effectiveKey){
  return Promise.all(items.filter(i=>i.password!=='[decrypt error]').map(async(item)=>{
    const json=JSON.stringify({service:item.service,username:item.username,password:item.password,category:item.category,notes:item.notes||'',url:item.url||'',createdAt:item.createdAt||Date.now(),updatedAt:item.updatedAt||Date.now()})
    return{id:item.id,encrypted:await directEncrypt(json,effectiveKey)}
  }))
}

async function encryptEntry(item,effectiveKey){
  const json=JSON.stringify({
    service:item.service,
    username:item.username,
    password:item.password,
    category:item.category,
    notes:item.notes||'',
    url:item.url||'',
    createdAt:item.createdAt||Date.now(),
    updatedAt:Date.now()
  })
  return directEncrypt(json,effectiveKey)
}

async function completeUnlock(effectiveKey,data){
  const{items,needsMigration}=await decryptEntries(data.entries,effectiveKey)
  if(needsMigration){data.entries=await migrateEntries(items,effectiveKey);saveData(data)}
  state.items=items
  state.categories=getAllCategories()
  state.page='unlocked';state.loading=false;state._totpSecret=''
  render();resetLockTimer()
}

async function handleUnlock(){
  if(!state.masterPassword)return
  state.loading=true;render()
  const data=loadData()
  if(!data.vault_hash){state.page='create';state.loading=false;render();return}
  const ok=await verifyPassword(state.masterPassword,data.vault_hash)
  if(!ok){toast('error','Sai mật khẩu chính!');state.loading=false;render();return}
  let effectiveKey=state.masterPassword
  if(data.vault_key_encrypted){
    try{effectiveKey=await aesDecrypt(data.vault_key_encrypted,state.masterPassword);state.vaultKey=effectiveKey}catch{}
  }
  if(data.totp_encrypted){
    try{
      state._totpSecret=await directDecrypt(data.totp_encrypted,effectiveKey)
      if(state.totpCode&&state.totpCode.length===6){
        const valid=await verifyTOTP(state._totpSecret,state.totpCode)
        if(!valid){toast('error','Mã 2FA không đúng');state.loading=false;render();return}
        await completeUnlock(effectiveKey,data)
        return
      }
      state.totpCode='';state.page='totp-verify';state.loading=false;render()
      return
    }catch{toast('error','Lỗi giải mã 2FA');state.loading=false;render();return}
  }
  await completeUnlock(effectiveKey,data)
}

function parseCSV(text){
  const lines = []
  let row = [], field = '', inQuotes = false
  for(let i=0; i<text.length; i++){
    const c = text[i]
    const next = text[i+1]
    if(c === '"'){
      if(inQuotes && next === '"'){ field += '"'; i++; }
      else { inQuotes = !inQuotes }
    } else if(c === ',' && !inQuotes){
      row.push(field.trim())
      field = ''
    } else if((c === '\r' || c === '\n') && !inQuotes){
      if(c === '\r' && next === '\n') i++
      row.push(field.trim())
      if(row.some(f => f)) lines.push(row)
      row = []
      field = ''
    } else {
      field += c
    }
  }
  if(field || row.length > 0){
    row.push(field.trim())
    if(row.some(f => f)) lines.push(row)
  }
  return lines
}

async function handleCSVImport(csvText){
  const rows = parseCSV(csvText)
  if(rows.length < 2) throw new Error('File CSV không chứa dòng tiêu đề hoặc dữ liệu!')
  const headers = rows[0].map(h => h.toLowerCase().replace(/[^a-z0-9_]/g, ''))
  const findCol = (keys) => headers.findIndex(h => keys.some(k => h.includes(k)))
  
  const titleIdx = findCol(['name', 'title', 'service', 'folder', 'app'])
  const userIdx = findCol(['user', 'username', 'email', 'login_username'])
  const passIdx = findCol(['pass', 'password', 'login_password'])
  const urlIdx = findCol(['url', 'uri', 'website', 'link'])
  const notesIdx = findCol(['note', 'notes', 'extra', 'comment'])

  const ek = state.vaultKey || state.masterPassword
  const data = loadData()
  let count = 0

  for(let i=1; i<rows.length; i++){
    const r = rows[i]
    const pass = passIdx >= 0 ? r[passIdx] : ''
    if(!pass) continue

    const service = (titleIdx >= 0 ? r[titleIdx] : '') || (urlIdx >= 0 ? r[urlIdx] : '') || 'Imported Service'
    const username = userIdx >= 0 ? r[userIdx] : ''
    const url = urlIdx >= 0 ? r[urlIdx] : ''
    const notes = notesIdx >= 0 ? r[notesIdx] : ''

    const id = crypto.randomUUID()
    const full = { service, username, password: pass, category: 'other', notes, url, createdAt: Date.now(), updatedAt: Date.now() }
    const enc = await encryptEntry(full, ek)
    data.entries.push({ id, encrypted: enc })
    state.items.push({ id, ...full })
    count++
  }
  saveData(data)
  return count
}

async function handleEnableWebAuthn(){
  if(!window.PublicKeyCredential){
    toast('error', 'Trình duyệt hoặc thiết bị không hỗ trợ Sinh trắc học WebAuthn!')
    return
  }
  const ek = state.vaultKey || state.masterPassword
  if(!ek){ toast('error', 'Cần mở khóa vault trước khi bật sinh trắc học'); return }

  try{
    const challenge = randBytes(32)
    const userId = randBytes(16)
    const cred = await navigator.credentials.create({
      publicKey: {
        challenge,
        rp: { name: "FEAR-Vault Cyber Password Manager" },
        user: {
          id: userId,
          name: "fear-vault-user",
          displayName: "FEAR Vault Owner"
        },
        pubKeyCredParams: [{ alg: -7, type: "public-key" }, { alg: -257, type: "public-key" }],
        authenticatorSelection: { userVerification: "preferred" },
        timeout: 60000
      }
    })

    if(!cred){ toast('error', 'Xác thực sinh trắc học bị hủy'); return }

    const rawCredId = bufToB64(cred.rawId)
    const encKey = await aesEncrypt(ek, rawCredId)
    const data = loadData()
    data.webauthn_enabled = true
    data.webauthn_cred_id = rawCredId
    data.webauthn_key_enc = encKey
    saveData(data)
    toast('success', 'Đã bật mở khóa bằng Vân tay / FaceID thành công!')
    render()
  }catch(e){
    toast('error', 'Lỗi thiết lập sinh trắc học: ' + e.message)
  }
}

async function handleWebAuthnUnlock(){
  const data = loadData()
  if(!data.webauthn_enabled || !data.webauthn_cred_id || !data.webauthn_key_enc){
    toast('error', 'Vân tay chưa được bật. Hãy bật trong Settings sau khi mở khóa!')
    return
  }
  if(!window.PublicKeyCredential){
    toast('error', 'Trình duyệt không hỗ trợ WebAuthn!')
    return
  }

  state.loading = true; render()
  try{
    const challenge = randBytes(32)
    const credIdBuf = b64ToBuf(data.webauthn_cred_id)
    const assertion = await navigator.credentials.get({
      publicKey: {
        challenge,
        allowCredentials: [{
          id: credIdBuf,
          type: 'public-key'
        }],
        userVerification: "preferred",
        timeout: 60000
      }
    })

    if(!assertion){
      toast('error', 'Xác thực sinh trắc học thất bại!')
      state.loading = false; render(); return
    }

    const effectiveKey = await aesDecrypt(data.webauthn_key_enc, data.webauthn_cred_id)
    state.vaultKey = effectiveKey
    await completeUnlock(effectiveKey, data)
    toast('success', 'Mở khóa Vân tay thành công!')
  }catch(e){
    toast('error', 'Lỗi xác thực vân tay: ' + e.message)
    state.loading = false; render()
  }
}

      } else {
        toast('error', 'Lỗi GitHub Gist API: ' + (resData.message || 'Token không hợp lệ'))
      }
    }catch(e){
      toast('error', 'Lỗi đẩy GitHub Gist: ' + e.message)
    }
  } catch(err) {
    toast('error', 'Lỗi mã hóa Gist: ' + err.message)
  } finally {
    state.loading = false; render()
  }
}

async function handleCloudPullGist(gistIdArg){
  const gistId = gistIdArg || prompt('Nhập GitHub Gist ID:')
  if(!gistId || !gistId.trim()) return
  state.loading = true; render()
  try{
    const res = await fetch(`https://api.github.com/gists/${gistId.trim()}`)
    const resData = await res.json()
    if(resData.files && resData.files['fear_vault_backup.json']){
      state.cloudSyncInput = resData.files['fear_vault_backup.json'].content
      state.loading = false; render()
      await handleCloudRestoreFromPayload()
    } else {
      toast('error', 'Không tìm thấy tệp fear_vault_backup.json trong Gist này')
    }
  }catch(e){
    toast('error', 'Lỗi kéo Gist từ GitHub: ' + e.message)
  }finally{
    state.loading = false; render()
  }
}

async function handleChangePassword(){
  const f=state.changePwForm
  if(!f.current||!f.newPw||!f.confirm)return
  if(f.newPw!==f.confirm){toast('error','Mật khẩu mới không khớp');return}
  if(f.newPw.length<6){toast('error','Mật khẩu phải ≥6 ký tự');return}
  state.loading=true;render()
  const d=loadData();const ok=await verifyPassword(f.current,d.vault_hash)
  if(!ok){toast('error','Sai mật khẩu hiện tại');state.loading=false;render();return}
  let vk=state.vaultKey;if(d.vault_key_encrypted){try{vk=await aesDecrypt(d.vault_key_encrypted,f.current)}catch{}}
  if(!vk){toast('error','Không thể giải mã vault key');state.loading=false;render();return}
  d.vault_hash=await hashPassword(f.newPw);d.vault_key_encrypted=await aesEncrypt(vk,f.newPw);saveData(d)
  state.vaultKey=vk;state.masterPassword='';state.showChangePw=false;state.changePwForm={current:'',newPw:'',confirm:''};state.loading=false
  toast('success','Đã đổi mật khẩu chính');render()
}

function handleSetup2FAStart(){
  const secretBytes=randBytes(20)
  state.setup2FASecret=base32Encode(secretBytes.buffer)
  state.setup2FACode='';state.show2FASetup=true;render()
  const uri=`otpauth://totp/FEAR-VAULT?secret=${state.setup2FASecret}&issuer=FEAR&algorithm=SHA1&digits=6&period=30`
  renderQR(uri,'qr-container')
}

async function handleVerify2FASetup(){
  if(state.setup2FACode.length!==6)return
  state.loading=true;render()
  const valid=await verifyTOTP(state.setup2FASecret,state.setup2FACode)
  if(!valid){toast('error','Mã xác thực không đúng. Kiểm tra lại ứng dụng.');state.loading=false;render();return}
  const ek=state.vaultKey||state.masterPassword
  const encrypted=await directEncrypt(state.setup2FASecret,ek)
  const data=loadData();data.totp_encrypted=encrypted;saveData(data)
  state.show2FASetup=false;state.setup2FASecret='';state.setup2FACode='';state.loading=false
  toast('success','2FA đã được bật thành công!');render()
}

async function handleDisable2FA(){
  const code=prompt('Nhập mã 6 chữ số từ app 2FA để xác nhận tắt 2FA:');if(!code||code.length!==6)return
  const data=loadData();if(!data.totp_encrypted)return
  const ek=state.vaultKey||state.masterPassword;let secret
  try{secret=await directDecrypt(data.totp_encrypted,ek)}catch{toast('error','Lỗi giải mã 2FA');return}
  const ok=await verifyTOTP(secret,code);if(!ok){toast('error','Mã xác thực không đúng');return}
  delete data.totp_encrypted;saveData(data)
  toast('success','2FA đã được tắt');render()
}

function renderEntries(){

      if(!i.service.toLowerCase().includes(q)&&!i.username.toLowerCase().includes(q)&&!(i.notes||'').toLowerCase().includes(q)) return false
    }
    if(state.activeCategory&&(i.category||'other')!==state.activeCategory) return false

  for(const i of state.items){const c=i.category||'other';catCount.set(c,(catCount.get(c)||0)+1)}

  if(pillsContainer&&allCats.length>1){
    const pillsHtml=allCats.map(([c,n])=>`<span class="pill${state.activeCategory===c?' active':''}" data-cat="${c}">${esc(c.toUpperCase())} (${n})</span>`).join('')

    const s = (c||'').toLowerCase()
    if(s.includes('email')||s.includes('mail')) return '🌐'
    if(s.includes('social')||s.includes('fb')||s.includes('ig')) return '💬'
    if(s.includes('dev')||s.includes('code')||s.includes('git')) return '💻'
    if(s.includes('finan')||s.includes('bank')||s.includes('money')||s.includes('donate')) return '💳'
    if(s.includes('shop')||s.includes('buy')) return '🛒'
    if(s.includes('work')||s.includes('job')) return '🏢'
    if(s.includes('game')||s.includes('penk')||s.includes('riot')) return '🎮'

          <span class="cat-title-text">TẤT CẢ TÀI KHOẢN</span>
        </div>
      </div>

      el.addEventListener('click', () => {

function bindEntryEvents(){
  document.querySelectorAll('[data-copy-id]').forEach(el=>{el.addEventListener('click',()=>{const item=state.items.find(i=>i.id===el.dataset.copyId);if(item)copyText(item.password)})})
  document.querySelectorAll('[data-show]').forEach(el=>{
    el.addEventListener('click',()=>{
      const id=el.dataset.show
      state.showPasswords[id]=!state.showPasswords[id]
      renderEntries()
    })
  })
  document.querySelectorAll('[data-note]').forEach(el=>{
    el.addEventListener('click',()=>{
      const id=el.dataset.note
      state.showNotes[id]=!state.showNotes[id]
      renderEntries()
    })
  })
  document.querySelectorAll('[data-edit]').forEach(el=>{
    el.addEventListener('click',()=>{
      const id=el.dataset.edit;const item=state.items.find(i=>i.id===id);
      if(item){
        state.editingId=id;
        state.editForm={service:item.service,username:item.username,password:item.password,category:item.category||'',notes:item.notes||'',url:item.url||''};
        renderEntries()
      }
    })
  })
  document.querySelectorAll('[data-del]').forEach(el=>{el.addEventListener('click',()=>{if(confirm('Xoá mục này?')){deleteItem(el.dataset.del)}})})

  document.getElementById('edit-service')?.addEventListener('input',e=>{state.editForm.service=e.target.value})
  document.getElementById('edit-user')?.addEventListener('input',e=>{state.editForm.username=e.target.value})
  document.getElementById('edit-pass')?.addEventListener('input',e=>{
    state.editForm.password=e.target.value
    const st=calcPasswordStrength(e.target.value)
    const meter=document.querySelector('.pw-meter-bar')
    const lbl=document.querySelector('.pw-strength-lbl')
    if(meter) { meter.style.width=st.percent+'%'; meter.style.backgroundColor=st.color; }
    if(lbl) { lbl.innerHTML=`<span style="color:var(--muted);">ĐỘ MẠNH:</span><span style="color:${st.color}">${st.text} (${st.score}/100)</span>` }
  })
  document.getElementById('edit-url')?.addEventListener('input',e=>{state.editForm.url=e.target.value})
  document.getElementById('edit-notes')?.addEventListener('input',e=>{state.editForm.notes=e.target.value})
  document.getElementById('edit-cat')?.addEventListener('change',e=>{
    if(e.target.value==='__new__') triggerAddCategory('edit')
    else state.editForm.category=e.target.value
  })
  document.getElementById('gen-edit')?.addEventListener('click',()=>{
    state.editForm.password=genPassword()
    renderEntries()
  })
  document.getElementById('save-edit')?.addEventListener('click',saveEdit)
  document.getElementById('cancel-edit')?.addEventListener('click',()=>{state.editingId=null;renderEntries()})
}

function esc(s){if(typeof s!=='string')return'';return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

// ─── EVENTS ──────────────────────────────────────────
let totpInterval=null, warnTimer=null

function triggerAddCategory(targetField){
  const catInput=prompt('Nhập tên danh mục mới (VD: crypto, game, personal, banking, cloud...):')
  if(catInput){
    const clean=addCustomCategory(catInput)
    if(clean){

      if(targetField==='edit') state.editForm.category=clean
      toast('success',`Đã tạo danh mục "${clean.toUpperCase()}"`)
      render()
    }
  }
}

function bindEvents(){
  const data=loadData()

  if(state.page==='locked'||state.page==='totp-verify'){
    const pw=document.getElementById('pw-input')
    if(pw){
      pw.focus()
      pw.addEventListener('input',e=>{
        const raw=e.target.value
        state.masterPassword=raw
        const warn=document.getElementById('pw-warn-msg')
        if(/[^\x00-\x7F]/.test(raw)){
          if(warn) warn.style.display='block'
        }else{
          if(warn) warn.style.display='none'
        }
      })
    }
    
    // OTP Boxes handling
    const otpBoxes=document.querySelectorAll('.otp-box')
    if(otpBoxes.length>0){
      otpBoxes.forEach((box, idx)=>{
        box.addEventListener('input', e=>{
          const val=e.target.value.replace(/\D/g,'')
          e.target.value=val
          let code=''
          otpBoxes.forEach(b=>code+=b.value)
          state.totpCode=code
          if(val && idx < 5){
            otpBoxes[idx+1].focus()
          }
          if(code.length===6 && state.masterPassword){
            handleUnlock()
          }
        })
        box.addEventListener('keydown', e=>{
          if(e.key==='Backspace'){
            if(!box.value && idx > 0){
              otpBoxes[idx-1].focus()
              otpBoxes[idx-1].value=''
              let code=''
              otpBoxes.forEach(b=>code+=b.value)
              state.totpCode=code
            }
          }
          if(e.key==='Enter'){
            handleUnlock()
          }
        })
        box.addEventListener('paste', e=>{
          e.preventDefault()
          const pasted=(e.clipboardData||window.clipboardData).getData('text').replace(/\D/g,'').slice(0,6)
          if(pasted){
            for(let i=0;i<6;i++){
              if(otpBoxes[i]) otpBoxes[i].value = pasted[i] || ''
            }
            state.totpCode=pasted
            if(pasted.length===6){
              otpBoxes[5].focus()
              if(state.masterPassword) handleUnlock()
            }
          }
        })
      })
    }

    // OTP Mousemove Wave Ripple
    document.querySelectorAll('.otp-group').forEach(group=>{
      const boxes=group.querySelectorAll('.otp-box, .setup-otp-box')
      if(boxes.length===0)return
      group.addEventListener('mousemove',e=>{
        boxes.forEach(box=>{
          if(document.activeElement===box)return
          const rect=box.getBoundingClientRect()
          const boxCenterX=rect.left+rect.width/2
          const boxCenterY=rect.top+rect.height/2
          const dist=Math.hypot(e.clientX-boxCenterX,e.clientY-boxCenterY)
          const maxDist=140
          if(dist<maxDist){
            const factor=Math.pow(1-dist/maxDist,1.5)
            const scale=1+factor*0.18
            const translateY=-factor*6
            box.style.transform=`scale(${scale}) translateY(${translateY}px)`
            box.style.borderColor=`rgba(0, 240, 255, ${0.35+factor*0.65})`
            box.style.boxShadow=`0 ${4*factor}px ${14*factor}px rgba(0, 240, 255, ${0.25*factor})`
            box.style.zIndex='10'
          }else{
            box.style.transform='scale(1) translateY(0)'
            box.style.borderColor='var(--border)'
            box.style.boxShadow='none'
            box.style.zIndex='1'
          }
        })
      })
      group.addEventListener('mouseleave',()=>{
        boxes.forEach(box=>{
          if(document.activeElement===box)return
          box.style.transform='scale(1) translateY(0)'
          box.style.borderColor='var(--border)'
          box.style.boxShadow='none'
          box.style.zIndex='1'
        })
      })
    })

    const timerEl=document.getElementById('totp-timer')
    if(timerEl){
      if(totpInterval) clearInterval(totpInterval)
      const updateTimer=()=>{
        const rem=30-(Math.floor(Date.now()/1000)%30)
        timerEl.textContent=`${rem}s`
      }
      updateTimer()
      totpInterval=setInterval(updateTimer,1000)
    }

    document.getElementById('toggle-master-pw')?.addEventListener('click',e=>{
      e.preventDefault()
      const inp=document.getElementById('pw-input')
      const btn=document.getElementById('toggle-master-pw')
      if(!inp||!btn)return

// ─── CYBER HUD MATRIX CANVAS & 3D CARD TILT ─────────
function initCyberHUDCanvas(){
  const canvas=document.getElementById('cosmic-canvas')
  if(!canvas)return
  const ctx=canvas.getContext('2d')
  let width=canvas.width=window.innerWidth
  let height=canvas.height=window.innerHeight
  window.addEventListener('resize',()=>{width=canvas.width=window.innerWidth;height=canvas.height=window.innerHeight})

  const charSet='0123456789ABCDEF0147INF22424735RANGEREGIONAREA'
  const fontSize=12
  const columns=Math.floor(width/fontSize)
  const drops=Array(columns).fill(1).map(()=>Math.floor(Math.random()*-50))

  const nodes=[]
  for(let i=0;i<35;i++){
    nodes.push({
      x:Math.random()*width,
      y:Math.random()*height,
      vx:(Math.random()-0.5)*0.4,
      vy:(Math.random()-0.5)*0.4,
      r:Math.random()*2+1
    })
  }

  let scanY=0

  function drawHUD(){
    ctx.fillStyle='#000000'
    ctx.fillRect(0,0,width,height)

    ctx.strokeStyle='rgba(239, 68, 68, 0.08)'
    ctx.lineWidth=1
    const gridSize=40
    for(let x=0;x<width;x+=gridSize){
      ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,height);ctx.stroke()
    }
    for(let y=0;y<height;y+=gridSize){
      ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(width,y);ctx.stroke()
    }

    ctx.font=`${fontSize}px 'JetBrains Mono', monospace`
    for(let i=0;i<drops.length;i+=2){
      const text=charSet[Math.floor(Math.random()*charSet.length)]
      const x=i*fontSize
      const y=drops[i]*fontSize
      
      ctx.fillStyle=Math.random()>0.88?'#ffffff':'rgba(239, 68, 68, 0.28)'
      ctx.fillText(text,x,y)

      if(y>height&&Math.random()>0.975){
        drops[i]=0
      }
      drops[i]++
    }

    ctx.fillStyle='#00f0ff'
    ctx.shadowBlur=0
    for(let i=0;i<nodes.length;i++){
      const n=nodes[i]
      n.x+=n.vx;n.y+=n.vy
      if(n.x<0||n.x>width)n.vx*=-1
      if(n.y<0||n.y>height)n.vy*=-1
      ctx.beginPath()
      ctx.arc(n.x,n.y,n.r,0,Math.PI*2)
      ctx.fill()
    }

    scanY=(scanY+1.2)%height
    const grad=ctx.createLinearGradient(0,scanY-15,0,scanY+15)
    grad.addColorStop(0,'rgba(239, 68, 68, 0)')
    grad.addColorStop(0.5,'rgba(239, 68, 68, 0.22)')
    grad.addColorStop(1,'rgba(239, 68, 68, 0)')
    ctx.fillStyle=grad
    ctx.fillRect(0,scanY-15,width,30)

    requestAnimationFrame(drawHUD)
  }

  drawHUD()

  if(window.innerWidth>768){
    document.addEventListener('mousemove',e=>{
      const card=document.querySelector('.lock-screen')
      if(card){
        const rect=card.getBoundingClientRect()
        const x=e.clientX-rect.left-rect.width/2
        const y=e.clientY-rect.top-rect.height/2
        const tiltX=(y/(rect.height/2))*-7
        const tiltY=(x/(rect.width/2))*7
        card.style.transform=`perspective(1000px) rotateX(${tiltX}deg) rotateY(${tiltY}deg) scale3d(1.015,1.015,1.015)`
      }
    })

    document.addEventListener('mouseleave',()=>{
      const card=document.querySelector('.lock-screen')
      if(card)card.style.transform='perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1,1,1)'
    })
  }
}

// ─── LOCK SCREEN CARD FINGERPRINT CANVAS ──────────────
function initLockCardFingerprintCanvas(){
  const canvas=document.getElementById('fp-card-canvas')
  if(!canvas)return
  const ctx=canvas.getContext('2d')
  const rect=canvas.getBoundingClientRect()
  let width=canvas.width=rect.width || 440
  let height=canvas.height=rect.height || 540

  let fpTime=0

  function drawCardFP(){
    if(!document.getElementById('fp-card-canvas'))return
    ctx.clearRect(0,0,width,height)

    fpTime+=0.03
    const fpX=width*0.5
    const fpY=height*0.44
    const fpRadius=Math.min(width,height)*0.26

    ctx.save()

    const boxSize=fpRadius*1.35
    const cLen=22
    ctx.strokeStyle='rgba(0, 240, 255, 0.85)'
    ctx.lineWidth=2.5
    ctx.shadowColor='#00f0ff'
    ctx.shadowBlur=12

    ctx.beginPath(); ctx.moveTo(fpX - boxSize, fpY - boxSize + cLen); ctx.lineTo(fpX - boxSize, fpY - boxSize); ctx.lineTo(fpX - boxSize + cLen, fpY - boxSize); ctx.stroke()
    ctx.beginPath(); ctx.moveTo(fpX + boxSize - cLen, fpY - boxSize); ctx.lineTo(fpX + boxSize, fpY - boxSize); ctx.lineTo(fpX + boxSize, fpY - boxSize + cLen); ctx.stroke()
    ctx.beginPath(); ctx.moveTo(fpX - boxSize, fpY + boxSize - cLen); ctx.lineTo(fpX - boxSize, fpY + boxSize); ctx.lineTo(fpX - boxSize + cLen, fpY + boxSize); ctx.stroke()
    ctx.beginPath(); ctx.moveTo(fpX + boxSize - cLen, fpY + boxSize); ctx.lineTo(fpX + boxSize, fpY + boxSize); ctx.lineTo(fpX + boxSize, fpY + boxSize - cLen); ctx.stroke()

    ctx.fillStyle='rgba(0, 240, 255, 0.6)'
    ctx.shadowBlur=4
    for(let gx = -1; gx <= 1; gx += 2){
      for(let gy = -1; gy <= 1; gy += 2){
        ctx.fillRect(fpX + gx * (boxSize - 10) - 2.5, fpY + gy * (boxSize - 10) - 2.5, 5, 5)
      }
    }

    ctx.lineWidth=2
    const numRings=9
    for(let i=1;i<=numRings;i++){
      const rX=(i/numRings)*fpRadius*0.72
      const rY=(i/numRings)*fpRadius*1.05
      
      const alpha=0.48+Math.sin(fpTime*2+i*0.4)*0.25
      ctx.strokeStyle=`rgba(0, 240, 255, ${alpha})`
      ctx.shadowColor='#00f0ff'
      ctx.shadowBlur=10

      ctx.beginPath()
      const startAngle=(i%2===0?0.3:0.7)+Math.sin(i+fpTime*0.4)*0.1
      const endAngle=Math.PI*2-(i%3===0?0.6:0.3)
      ctx.ellipse(fpX,fpY,rX,rY,0,startAngle,endAngle)
      ctx.stroke()

      if(i%2===1){
        const midAngle=startAngle+(endAngle-startAngle)*0.45
        const px=fpX+Math.cos(midAngle)*rX
        const py=fpY+Math.sin(midAngle)*rY
        ctx.fillStyle='#00f0ff'
        ctx.beginPath()
        ctx.arc(px,py,2.5,0,Math.PI*2)
        ctx.fill()
      }
    }

    const p1Time=(fpTime*2)%(Math.PI*2)
    const p2Time=(fpTime*1.6+2)%(Math.PI*2)

    const n1X=fpX+Math.cos(fpTime*0.7)*(fpRadius*0.22)
    const n1Y=fpY-fpRadius*0.4+Math.sin(fpTime*0.5)*(fpRadius*0.1)
    ctx.fillStyle='#ffffff'
    ctx.shadowColor='#ffffff'
    ctx.shadowBlur=24
    ctx.beginPath()
    ctx.arc(n1X,n1Y,8+Math.sin(p1Time)*2.5,0,Math.PI*2)
    ctx.fill()

    const n2X=fpX-fpRadius*0.28+Math.sin(fpTime*0.6)*(fpRadius*0.08)
    const n2Y=fpY+fpRadius*0.42+Math.cos(fpTime*0.5)*(fpRadius*0.08)
    ctx.fillStyle='#ffffff'
    ctx.shadowColor='#00f0ff'
    ctx.shadowBlur=22
    ctx.beginPath()
    ctx.arc(n2X,n2Y,7+Math.cos(p2Time)*2.5,0,Math.PI*2)
    ctx.fill()

    const fpLaserY=fpY-boxSize+((fpTime*60)%(boxSize*2))
    const fpLaserGrad=ctx.createLinearGradient(fpX-boxSize,fpLaserY,fpX+boxSize,fpLaserY)
    fpLaserGrad.addColorStop(0,'rgba(0,240,255,0)')
    fpLaserGrad.addColorStop(0.5,'rgba(255,255,255,0.98)')
    fpLaserGrad.addColorStop(1,'rgba(0,240,255,0)')
    
    ctx.strokeStyle=fpLaserGrad
    ctx.lineWidth=3
    ctx.shadowColor='#00f0ff'
    ctx.shadowBlur=16
    ctx.beginPath()
    ctx.moveTo(fpX-boxSize,fpLaserY)
    ctx.lineTo(fpX+boxSize,fpLaserY)
    ctx.stroke()

    const fpBeamGrad=ctx.createLinearGradient(0,fpLaserY-12,0,fpLaserY+12)
    fpBeamGrad.addColorStop(0,'rgba(0,240,255,0)')
    fpBeamGrad.addColorStop(0.5,'rgba(0,240,255,0.3)')
    fpBeamGrad.addColorStop(1,'rgba(0,240,255,0)')
    ctx.fillStyle=fpBeamGrad
    ctx.fillRect(fpX-boxSize,fpLaserY-12,boxSize*2,24)

    ctx.shadowBlur=0
    ctx.font="10px 'JetBrains Mono', monospace"
    ctx.fillStyle='#00f0ff'
    ctx.fillText("BIOMETRIC FINGERPRINT SCANNER", fpX - boxSize, fpY + boxSize + 18)

    for(let b=0;b<9;b++){
      const bh=3+Math.abs(Math.sin(fpTime*5+b*0.8))*12
      ctx.fillRect(fpX+boxSize-38+b*4.5,fpY+boxSize+16-bh,3,bh)
    }

    ctx.restore()
    requestAnimationFrame(drawCardFP)
  }

  drawCardFP()
}

// ─── TOUCH SWIPE-TO-CLOSE MODAL ────────────────────
let touchStartY=0
document.addEventListener('touchstart',e=>{
  const modal=e.target.closest('.modal')
  if(modal)touchStartY=e.touches[0].clientY
},{passive:true})

document.addEventListener('touchmove',e=>{
  const modal=e.target.closest('.modal-overlay')
  if(!modal||!touchStartY)return
  const dy=e.touches[0].clientY-touchStartY
  if(dy>80){
    touchStartY=0
    const closeBtn=modal.querySelector('[onclick*="close"], .modal .btn-terminal, .modal-overlay')
    if(state.showCloudSync){state.showCloudSync=false;render()}
    else if(state.showCatManager){state.showCatManager=false;render()}
    else if(state.showHealthCheck){state.showHealthCheck=false;render()}
    else if(state.showChangePw){state.showChangePw=false;render()}
    else if(state.show2FASetup){state.show2FASetup=false;state.setup2FASecret='';state.setup2FACode='';render()}
  }
},{passive:true})

// ─── INIT ────────────────────────────────────────────
document.addEventListener('click',resetLockTimer)
document.addEventListener('keydown',e=>{
  resetLockTimer()
  if(state.page==='unlocked'){
    if((e.key==='/'||((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='f'))&&document.activeElement?.tagName!=='INPUT'&&document.activeElement?.tagName!=='TEXTAREA'&&document.activeElement?.tagName!=='SELECT'){
      e.preventDefault()
      document.getElementById('search-input')?.focus()
    }
    if(e.key==='Escape'){
      if(state.showCatManager){state.showCatManager=false;render()}
      else if(state.showCloudSync){state.showCloudSync=false;render()}
      else if(state.showHealthCheck){state.showHealthCheck=false;render()}
      else if(state.showChangePw){state.showChangePw=false;render()}
      else if(state.show2FASetup){state.show2FASetup=false;state.setup2FASecret='';state.setup2FACode='';render()}
      else if(state.editingId){state.editingId=null;render()}
      else if(state.showAdd){state.showAdd=false;render()}
    }
  }
})

// PWA Manifest & Service Worker Registration
if(window.location.protocol.startsWith('http')){
  const manifestLink=document.createElement('link')
  manifestLink.rel='manifest'
  manifestLink.href='./manifest.json'
  document.head.appendChild(manifestLink)

  if('serviceWorker' in navigator){
    window.addEventListener('load',()=>{
      navigator.serviceWorker.register('./sw.js').catch(()=>{})
    })
  }
}

initIndexedDBAutoRestore()
state.page='locked';state.masterPassword=''
render()
initCyberHUDCanvas()
</script>
